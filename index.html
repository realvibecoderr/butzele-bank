<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6ECE1">
  <meta name="description" content="Spar-App mit Pixel-Dackel: Jede Einzahlung macht Butzele glücklich.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Butzele">
  <title>Butzele Bank</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand" aria-label="Butzele Bank">butzele<span>bank</span></div>
      <button class="icon-btn" data-action="settings" aria-label="Einstellungen">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <section id="dogCard" class="dog-card mood-2">
      <div class="mood-row">
        <span class="mood-pill" id="moodPill"></span>
        <span class="hearts" id="hearts" role="img"></span>
      </div>
      <div class="stage">
        <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
        <canvas id="dogCanvas" class="pixel" aria-label="Dein Spar-Dackel. Antippen zum Streicheln." role="img"></canvas>
      </div>
      <div class="dog-stats">
        <div>
          <div class="big-amount" id="totalSaved">0,00 €</div>
          <div class="sub" id="totalSub"></div>
        </div>
        <div class="streak-badge" id="streakBadge"></div>
      </div>
    </section>

    <main id="view"></main>
  </div>

  <nav class="tabbar" aria-label="Navigation">
    <div class="tabbar-inner">
      <button class="tab active" data-action="tab" data-tab="home">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Start
      </button>
      <button class="tab" data-action="tab" data-tab="stashes">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 12h18c0 4.4-4 7-9 7s-9-2.6-9-7z"/><path d="M7.5 12c0-2 2-3.5 4.5-3.5s4.5 1.5 4.5 3.5"/><path d="M14.5 5.5l2-2M17 7l2.5-1"/></svg>Näpfe
      </button>
      <button class="tab" data-action="tab" data-tab="goals">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Ziele
      </button>
      <button class="tab" data-action="tab" data-tab="history">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Verlauf
      </button>
    </div>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/dog.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
